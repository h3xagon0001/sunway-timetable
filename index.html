<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Sunway Timetable</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div>Sunway Timetable</div>

    <div>Time now: <span id="clockElement"></span></div>

    <div>Status Checker</div>

    <table class="timetable">
        <!-- time periods -->
        <tr>
            <td>/</td>
            <td>/</td>
        </tr>

        <!-- monday -->
        <tr>
            <th scope="row">Mon</th>
            <td>/</td>
        </tr>

        <!-- tuesday -->
        <tr>
            <th scope="row">Tues</th>
            <td>/</td>
        </tr>

        <!-- wednesday -->
        <tr>
            <th scope="row">Wed</th>
            <td>/</td>
        </tr>

        <!-- thursday -->
        <tr>
            <th scope="row">Thurs</th>
            <td>/</td>
        </tr>

        <!-- friday -->
        <tr>
            <th scope="row">Fri</th>
            <td>/</td>
        </tr>
    </table>
    
    <script src="index.js"></script>
  </body>
</html>
