<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Sunway Timetable</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div>Sunway Timetable</div>

    <div>Time now: <span id="clockElement"></span></div>

    <div>Status Checker</div>

    <table class="timetable">
        <!-- time periods -->
        <tr>
            <td class="first-col">/</td>
            <td id="timePeriodElement"></td>
        </tr>

        <!-- monday -->
        <tr>
            <th class="first-col" scope="row">Mon</th>
            <td id="monElement"></td>
        </tr>

        <!-- tuesday -->
        <tr>
            <th class="first-col" scope="row">Tues</th>
            <td id="tuesElement"></td>
        </tr>

        <!-- wednesday -->
        <tr>
            <th class="first-col" scope="row">Wed</th>
            <td id="wedElement"></td>
        </tr>

        <!-- thursday -->
        <tr>
            <th class="first-col" scope="row">Thurs</th>
            <td id="thursElement"></td>
        </tr>

        <!-- friday -->
        <tr>
            <th class="first-col" scope="row">Fri</th>
            <td id="friElement"></td>
        </tr>
    </table>
    
    <script src="index.js"></script>
  </body>
</html>
