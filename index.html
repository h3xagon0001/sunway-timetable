<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Sunway Timetable</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div>Sunway Timetable</div>

    <div>Time now: <span id="clockElement"></span></div>

    <div class="overflow-x-scroll position-relative">
        <canvas id="barElement"></canvas>
        <table class="timetable">
            <!-- time periods -->
            <tr>
                <td class="timetable-heading">/</td>
                <td class="timetable-data" id="timePeriodElement"></td>
            </tr>

            <!-- monday -->
            <tr>
                <th class="timetable-heading" scope="row">Mon</th>
                <td class="timetable-data" id="monElement"></td>
            </tr>

            <!-- tuesday -->
            <tr>
                <th class="timetable-heading" scope="row">Tues</th>
                <td class="timetable-data" id="tuesElement"></td>
            </tr>

            <!-- wednesday -->
            <tr>
                <th class="timetable-heading" scope="row">Wed</th>
                <td class="timetable-data" id="wedElement"></td>
            </tr>

            <!-- thursday -->
            <tr>
                <th class="timetable-heading" scope="row">Thurs</th>
                <td class="timetable-data" id="thursElement"></td>
            </tr>

            <!-- friday -->
            <tr>
                <th class="timetable-heading" scope="row">Fri</th>
                <td class="timetable-data" id="friElement"></td>
            </tr>
        </table>
    </div>
    
    <script src="index.js"></script>
  </body>
</html>
